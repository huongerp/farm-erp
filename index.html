
<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>Forpeasantz</title>
    <!-- Open Graph (share preview) – dùng logo app (URL local để tránh 403 từ Facebook CDN) -->
    <meta property="og:title" content="Forpeasantz" />
    <meta property="og:description" content="Hợp Tác Xã Nông Nghiệp Công Nghệ Cao FP - Forpeasantz" />
    <meta property="og:image" content="/icons/icon-512.png" />
    <!-- Favicon & logo app (logo trên browser tab) – logo công ty, khai nhiều cỡ
         để màn hình HiDPI lấy bản nét thay vì phóng to bản 32px. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/icons/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/icons/favicon-96.png" />
    <!-- iOS bỏ qua icon trong manifest và KHÔNG đọc được SVG ở đây; thiếu file
         PNG này thì icon ngoài màn hình chính chỉ là ảnh chụp trang trắng. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    
    <!-- Default font (Inter) + Noto Sans fallback – other fonts lazy-loaded on demand -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Lưới an toàn chống màn trắng: script entry không tải được (thường do service
         worker cũ giữ index.html của bản deploy trước, trỏ vào chunk đã bị xoá) thì
         không còn dòng JS nào chạy để tự sửa, mà service worker mới lại phải chờ app
         gửi SKIP_WAITING nên trang kẹt trắng vĩnh viễn. Đoạn này gỡ service worker,
         xoá cache vỏ rồi tải lại MỘT lần duy nhất trong phiên.

         Ba cửa ải trước khi ra tay, để không phá nhầm bản chạy offline:
         - phải đang có mạng: mất mạng thì tải lại cũng vô ích, mà xoá cache đi là
           người dùng mất luôn khả năng dùng offline;
         - app phải CHƯA khởi động: chunk tải hụt sau khi app đã chạy đã có
           `vite:preloadError` trong index.tsx lo, không đụng tới;
         - chỉ một lần mỗi phiên, tránh vòng lặp tải lại nếu nguyên nhân là thứ khác. -->
    <script>
      (function () {
        var KEY = 'app-shell-tu-chua';
        window.addEventListener(
          'error',
          function (e) {
            var el = e && e.target;
            if (!el || el === window) return;
            // Chỉ vỏ hỏng mới làm trắng màn hình: đúng thẻ script bundle của app,
            // cùng origin. Stylesheet hay font ngoài (Google Fonts) tải hụt chỉ làm
            // trang xấu đi chứ app vẫn chạy — nổ ở đó là xoá cache oan.
            if (el.tagName !== 'SCRIPT') return;
            var src = el.src || '';
            if (src.indexOf(window.location.origin + '/assets/') !== 0) return;
            // App đã khởi động rồi thì đây là chunk lazy, không phải vỏ hỏng.
            if (window.__APP_DA_KHOI_DONG) return;
            // Mất mạng: giữ nguyên cache để lần sau còn vào được.
            if (navigator.onLine === false) return;
            // Không có service worker điều khiển thì lỗi nằm ở mạng hoặc server,
            // tải lại cũng vô ích — để lỗi hiện nguyên trạng.
            if (!navigator.serviceWorker || !navigator.serviceWorker.controller) return;
            try {
              if (sessionStorage.getItem(KEY)) return;
              sessionStorage.setItem(KEY, '1');
            } catch (err) {
              return;
            }
            navigator.serviceWorker
              .getRegistrations()
              .then(function (dsReg) {
                return Promise.all(
                  dsReg.map(function (reg) {
                    return reg.unregister();
                  })
                );
              })
              .then(function () {
                if (typeof caches === 'undefined') return null;
                return caches.keys().then(function (ten) {
                  // Chỉ xoá cache chứa vỏ HTML hỏng; ảnh, font, chunk giữ nguyên.
                  var voHtml = ten.filter(function (t) {
                    return t === 'app-shell' || t.indexOf('workbox-precache') === 0;
                  });
                  return Promise.all(
                    voHtml.map(function (t) {
                      return caches.delete(t);
                    })
                  );
                });
              })
              .catch(function () {
                /* gỡ không được thì vẫn cứ tải lại, may ra vớt được */
              })
              .then(function () {
                window.location.reload();
              });
          },
          true
        );
      })();
    </script>
    <!-- Áp dụng chế độ tối + cỡ chữ ngay khi tải (trước React) để tránh nháy -->
    <script>
      (function() {
        try {
          var raw = localStorage.getItem('ui-storage');
          if (!raw) return;
          var data = JSON.parse(raw);
          var state = data && data.state;
          if (!state) return;
          var el = document.documentElement;
          // Dark mode
          var scheme = state.colorScheme;
          var isDark = scheme === 'dark' || (scheme === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            el.classList.add('dark');
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#0f172a');
          } else {
            el.classList.remove('dark');
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#ffffff');
          }
          // Text size preference
          var fontSize = state.fontSize;
          if (fontSize) el.dataset.textSize = fontSize;
          // Language
          var lang = state.language;
          if (lang === 'en') el.lang = 'en';
          // Primary color – prevent flash of default color
          var colorMap = {
            blue:'221.2 83.2% 53.3%', violet:'262.1 83.3% 57.8%',
            emerald:'142.1 76.2% 36.3%', rose:'346.8 77.2% 49.8%',
            amber:'37.7 92.1% 50.2%', orange:'24.6 95% 53.1%',
            cyan:'188.7 94.5% 42.7%', slate:'215.4 16.3% 46.9%'
          };
          var pc = state.primaryColor;
          if (pc && colorMap[pc]) {
            var v = colorMap[pc];
            el.style.setProperty('--primary', v);
            el.style.setProperty('--ring', v);
            el.style.setProperty('--secondary-foreground', v);
            el.style.setProperty('--accent-foreground', v);
            el.style.setProperty('--color-primary', 'hsl(' + v + ')');
            el.style.setProperty('--color-ring', 'hsl(' + v + ' / 0.5)');
          }
        } catch (e) {}
      })();
    </script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
