# =====================================================================
# Deploy trên Dokploy — 3 service sau MỘT domain duy nhất
#
#   /        → web        (SPA Vite, nginx)
#   /api/*   → postgrest  (REST cho dữ liệu nghiệp vụ)
#   /auth/*  → auth       (đăng nhập, ký JWT)
#   /notify/*→ notify     (đăng ký Web Push + worker thông báo)
#
# Một domain nên KHÔNG có CORS và không có request cross-site nào.
# Frontend gọi bằng đường dẫn tương đối `/api`, `/auth` → không phải build
# lại image khi đổi domain.
#
# Postgres KHÔNG nằm ở đây: dùng database Dokploy đang có (fpfarm), truy cập
# qua hostname nội bộ trên dokploy-network.
#
# Biến môi trường: khai trong tab Environment của Dokploy, xem .env.example.
# Kế hoạch: docs/VPS_POSTGREST_PLAN.md
# =====================================================================

services:
  postgrest:
    image: postgrest/postgrest:v14.16
    restart: always
    environment:
      # Role `authenticator`, hostname NỘI BỘ (không đi qua IP public).
      PGRST_DB_URI: ${PGRST_DB_URI}
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${PGRST_JWT_SECRET}
      # pgcrypto nằm ở schema `extensions`.
      PGRST_DB_EXTRA_SEARCH_PATH: 'public, extensions'
      # Không phơi toàn bộ schema ra Internet.
      PGRST_OPENAPI_MODE: disabled
      PGRST_DB_POOL: '10'
      PGRST_SERVER_PORT: '3000'
      # KHÔNG đặt PGRST_DB_MAX_ROWS: fetchAllRows/fetchTablePage tự phân trang
      # 1000 dòng và dựa vào count=exact, đặt max-rows sẽ làm lệch Content-Range.
    expose:
      - '3000'
    networks:
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.farm-api.rule=Host(`${APP_DOMAIN}`) && PathPrefix(`/api`)
      - traefik.http.routers.farm-api.entrypoints=websecure
      - traefik.http.routers.farm-api.tls.certResolver=letsencrypt
      - traefik.http.routers.farm-api.priority=100
      - traefik.http.routers.farm-api.middlewares=farm-api-strip,farm-api-compress
      - traefik.http.middlewares.farm-api-strip.stripprefix.prefixes=/api
      # PostgREST không tự nén; nginx chỉ phục vụ SPA nên không chạm được /api.
      # JSON lặp key nén còn ~10-20% — đòn bẩy egress lớn nhất của app.
      - traefik.http.middlewares.farm-api-compress.compress=true
      - traefik.http.middlewares.farm-api-compress.compress.minresponsebodybytes=1024
      - traefik.http.services.farm-api.loadbalancer.server.port=3000

  auth:
    build:
      context: ./services/auth
    restart: always
    environment:
      # Role `auth_service` — chỉ EXECUTE được mấy RPC đăng nhập.
      DATABASE_URL: ${AUTH_DATABASE_URL}
      # Dùng chung secret với PostgREST, nếu không token ký ra sẽ bị từ chối.
      JWT_SECRET: ${PGRST_JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      ACCESS_TOKEN_TTL_SECONDS: '900'
      PORT: '3001'
    expose:
      - '3001'
    networks:
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.farm-auth.rule=Host(`${APP_DOMAIN}`) && PathPrefix(`/auth`)
      - traefik.http.routers.farm-auth.entrypoints=websecure
      - traefik.http.routers.farm-auth.tls.certResolver=letsencrypt
      - traefik.http.routers.farm-auth.priority=100
      - traefik.http.routers.farm-auth.middlewares=farm-auth-strip
      - traefik.http.middlewares.farm-auth-strip.stripprefix.prefixes=/auth
      - traefik.http.services.farm-auth.loadbalancer.server.port=3001

  notify:
    build:
      context: ./services/notify
    restart: always
    environment:
      # Role `notify_service` — chỉ chạm được 4 bảng thông báo và 3 RPC tra cứu.
      DATABASE_URL: ${NOTIFY_DATABASE_URL}
      # Dùng chung secret để xác thực access token do auth-service ký.
      JWT_SECRET: ${PGRST_JWT_SECRET}
      # Sinh một lần bằng `npx web-push generate-vapid-keys`. Thiếu hai biến này
      # thì chuông trong app vẫn chạy, chỉ tắt phần đẩy ra màn hình khoá.
      VAPID_PUBLIC_KEY: ${VITE_VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT}
      COMPANY_TZ: ${COMPANY_TZ:-Asia/Ho_Chi_Minh}
      PORT: '3002'
    expose:
      - '3002'
    networks:
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.farm-notify.rule=Host(`${APP_DOMAIN}`) && PathPrefix(`/notify`)
      - traefik.http.routers.farm-notify.entrypoints=websecure
      - traefik.http.routers.farm-notify.tls.certResolver=letsencrypt
      - traefik.http.routers.farm-notify.priority=100
      - traefik.http.routers.farm-notify.middlewares=farm-notify-strip
      - traefik.http.middlewares.farm-notify-strip.stripprefix.prefixes=/notify
      - traefik.http.services.farm-notify.loadbalancer.server.port=3002

  sheets:
    build:
      context: ./services/sheets
    restart: always
    environment:
      # Role `sheets_service` — chỉ chạm bảng kết nối/lịch đồng bộ Google Sheet (docs/migrations/011-*).
      DATABASE_URL: ${SHEETS_DATABASE_URL}
      # Dùng chung secret để xác thực access token do auth-service ký.
      JWT_SECRET: ${PGRST_JWT_SECRET}
      # Khoá mã hoá token Google (openssl rand -hex 32). Đổi khoá = mọi người phải kết nối lại.
      SHEETS_TOKEN_KEY: ${SHEETS_TOKEN_KEY}
      # OAuth client cho Google Sheet — biến RIÊNG, tách khỏi GOOGLE_CLIENT_ID (nút đăng nhập Google):
      # điền biến này không làm bật đăng nhập Google. Xem docs/GOOGLE_SHEETS.md.
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET}
      # Phải khai y hệt ở mục "Authorized redirect URIs" của OAuth client.
      GOOGLE_OAUTH_REDIRECT_URI: https://${APP_DOMAIN}/sheets/google/callback
      # Worker đọc dữ liệu nguồn qua PostgREST nội bộ, bằng JWT của người tạo lịch (RLS áp đúng).
      POSTGREST_URL: http://postgrest:3000
      # Chỉ bật ở production — dev dùng chung DB, hai worker sẽ ghi đè nhau.
      SHEETS_WORKER_BAT: ${SHEETS_WORKER_BAT:-true}
      COMPANY_TZ: ${COMPANY_TZ:-Asia/Ho_Chi_Minh}
      PORT: '3003'
    expose:
      - '3003'
    networks:
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.farm-sheets.rule=Host(`${APP_DOMAIN}`) && PathPrefix(`/sheets`)
      - traefik.http.routers.farm-sheets.entrypoints=websecure
      - traefik.http.routers.farm-sheets.tls.certResolver=letsencrypt
      - traefik.http.routers.farm-sheets.priority=100
      - traefik.http.routers.farm-sheets.middlewares=farm-sheets-strip
      - traefik.http.middlewares.farm-sheets-strip.stripprefix.prefixes=/sheets
      - traefik.http.services.farm-sheets.loadbalancer.server.port=3003

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
      args:
        # Vite nhúng biến vào bundle lúc build, nên phải truyền qua build args.
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
        VITE_CLOUDINARY_CLOUD_NAME: ${VITE_CLOUDINARY_CLOUD_NAME}
        VITE_CLOUDINARY_UPLOAD_PRESET: ${VITE_CLOUDINARY_UPLOAD_PRESET}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN}
        VITE_VAPID_PUBLIC_KEY: ${VITE_VAPID_PUBLIC_KEY}
        # Google Picker — chọn file Sheet có sẵn khi xuất. Thiếu thì chỉ còn "Tạo file mới".
        VITE_GOOGLE_PICKER_API_KEY: ${VITE_GOOGLE_PICKER_API_KEY}
        VITE_GOOGLE_APP_ID: ${VITE_GOOGLE_APP_ID}
    restart: always
    expose:
      - '80'
    networks:
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.farm-web.rule=Host(`${APP_DOMAIN}`)
      - traefik.http.routers.farm-web.entrypoints=websecure
      - traefik.http.routers.farm-web.tls.certResolver=letsencrypt
      - traefik.http.routers.farm-web.priority=1
      - traefik.http.services.farm-web.loadbalancer.server.port=80

# Bắt buộc phải gắn dokploy-network, không thì Traefik không thấy container và
# trả 404 dù label đã đúng (Dokploy issue #3435).
networks:
  dokploy-network:
    external: true
