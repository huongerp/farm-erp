# Header bảo mật cho SPA. File này được `include` trong TỪNG location của nginx.conf:
# nginx bỏ toàn bộ add_header cấp server khi location có add_header riêng (Cache-Control),
# nên khai một lần ở server là KHÔNG tới được index.html.

add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

# CSP đang ở chế độ Report-Only: trình duyệt chỉ ghi vi phạm vào Console, KHÔNG chặn.
# Chạy thật một thời gian (đăng nhập Google, chọn file Sheet, upload ảnh, xuất PDF, in tem),
# Console không còn dòng "[Report Only] Refused to …" thì đổi tên header thành
# `Content-Security-Policy` để bật chặn.
# Hai hash sha256 là của 2 thẻ <script> inline trong index.html — sửa nội dung 2 thẻ đó phải
# tính lại: `npm run build && node scripts/csp-hash.mjs`.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'sha256-y9cCZFPshIrTF4luhgH1es/25OUV6BZ7AliNzAgQV08=' 'sha256-Wsq5i21m4fgiHTTG/j+hRQJCicdNEauju0XLIkzOspo=' https://accounts.google.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.sentry.io https://accounts.google.com https://www.googleapis.com https://content.googleapis.com https://oauth2.googleapis.com; frame-src https://accounts.google.com https://docs.google.com https://drive.google.com; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
