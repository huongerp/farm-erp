server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Asset của Vite có hash trong tên nên cache vĩnh viễn được.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # index.html KHÔNG được cache, nếu không người dùng vẫn nạp bundle cũ sau khi deploy.
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
  }

  # SPA dùng react-router: mọi đường dẫn không phải file đều trả index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
